[project]
name = "marin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Subhamoy Datta", email = "subhamoydatta99@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]   

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[project.scripts]
marin = "marin:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
