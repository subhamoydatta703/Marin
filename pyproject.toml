[project]
name = "marin"
version = "0.1.0"
description = "Voice companion you install locally. Uses your own Gemini API key."
readme = "README.md"
authors = [
    { name = "Subhamoy Datta", email = "subhamoydatta99@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    # Exact pins, kept in sync with uv.lock so `pip install` and `uv sync`
    # resolve the same tested versions. torch/torchaudio match PyPI releases
    # (uv additionally installs the +cu126 variants from the index below).
    "numpy==2.5.3",
    "scipy==1.18.1",
    "sounddevice==0.5.6",
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "transformers==5.17.0",
    "google-genai==2.23.0",
    "pydantic==2.13.5",
    "kokoro==0.9.4",
    "rich==15.0.0",
    "edge-tts==7.2.8",
    "pydub==0.25.1",
    "python-dotenv==1.2.3",
    "accelerate==1.15.0",
    "soundfile==0.14.0",
    "funasr==1.4.16",
    "modelscope==1.40.1",
    "onnxruntime==1.30.0",
    "gradio==6.28.0",
    "spaces==0.51.3",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "python-multipart==0.0.32",
    "librosa==1.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[project.scripts]
marin = "marin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/backend",
  "/server.py",
  "/frontend",
  "/README.md",
  "/.env.example",
]
exclude = [
  "/frontend/node_modules",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marin"]

[tool.hatch.build.targets.wheel.force-include]
"src/app.py" = "app.py"
"src/llm" = "llm"
"src/speech_and_emotion" = "speech_and_emotion"
"src/speech_to_text" = "speech_to_text"
"src/speech_recognition" = "speech_recognition"
"src/text_to_speech" = "text_to_speech"
"src/validation" = "validation"
"src/interruption" = "interruption"
"backend" = "backend"
"server.py" = "server.py"
"frontend/dist" = "frontend/dist"

[tool.pyright]
extraPaths = [".", "src"]

