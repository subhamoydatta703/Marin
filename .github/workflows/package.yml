name: package

on:
  pull_request:
  push:
    branches: [main, feature/frontend-backend]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  wheel:
    name: Build wheel, verify contents, CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild frontend (committed dist must stay fresh)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dist

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check wheel contents
        run: python scripts/check_wheel.py dist/marin-*.whl

      - name: Install wheel (no deps) and smoke-test the CLI
        run: |
          python -m pip install dist/marin-*.whl --no-deps python-dotenv
          marin --help
          python -c "import marin, marin.cli, marin.config; print('marin imports OK')"

  install:
    # Full `pip install` from git - exactly what end users run. Heavy (torch +
    # CUDA), so it only runs nightly / on demand instead of every PR.
    name: Full pip install from git (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip install from git
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+${{ github.server_url }}/${{ github.repository }}.git@${{ github.ref_name }}"

      - name: CLI + API smoke
        env:
          GEMINI_API_KEY: dummy
        run: |
          marin --help
          python -c "import server; print('server imports OK')"